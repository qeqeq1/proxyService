name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        run: |
          set +e
          go test ./... 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 失败日志推到 ci-logs 分支，公开仓库可直接读，省得依赖有权限的账号下日志。
            mkdir -p ci
            cp test-output.log ci/last-test-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci/last-test-failure.log
            git commit -m "ci: record failing test output [skip ci]" || true
            git push origin HEAD:refs/heads/ci-logs --force || true
          fi
          exit "$status"

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="njust-proxy-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then name="${name}.exe"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/${name}" .
          done
          ls -lh dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated build from $GITHUB_SHA"

      - name: Keep artifacts for manual dispatch
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: njust-proxy
          path: dist/*
