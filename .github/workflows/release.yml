name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="njust-proxy-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then name="${name}.exe"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/${name}" .
          done
          ls -lh dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated build from $GITHUB_SHA"

      - name: Keep artifacts for manual dispatch
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: njust-proxy
          path: dist/*
